<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        const path = window.location.pathname;
        const search = window.location.search;
        const hash = window.location.hash;

        window.location.replace(
            '/' + '?/' + path.slice(1) + search.replace(/&/g, '~and~') + hash
        );
    </script>
</head>
<body>
</body>
</html>
